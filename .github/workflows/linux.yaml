name: CI for Linux
# https://github.com/marinaMoji/marinaMoji/blob/main/docs/build_marinamoji_for_linux.md

# Run on push and pull request.
on:
  - push
  - pull_request

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify_opencc_tables:
    # Ensures the committed marina OpenCC dictionaries (.json/.ocd2) match
    # what src/regen_opencc.sh produces from the hand-edited CSVs in
    # src/data/marina_opencc/tables/. Catches a CSV edit that wasn't
    # followed by a local `bash regen_opencc.sh` + commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Install OpenCC
        run: |
          sudo apt-get update
          sudo apt-get install -y opencc libopencc-dev

      - name: Regenerate tables
        working-directory: ./src
        run: bash regen_opencc.sh

      - name: Fail if regeneration produced a diff
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/data/marina_opencc; then
            echo "::error::src/data/marina_opencc is stale. Run 'bash regen_opencc.sh' from src/ and commit the result."
            git diff --stat -- src/data/marina_opencc
            exit 1
          fi

  build:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    # ubuntu-24.04-arm is GitHub's hosted arm64 runner (free for public repos).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev libgtk-3-dev librsvg2-dev libopencc-dev dpkg-dev unzip
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build package --config release_build

      - name: Rename artifact
        working-directory: ./src
        run: |
          cp bazel-bin/unix/mozc.zip bazel-bin/unix/marinaMoji-linux-${{ matrix.arch }}.zip

      - name: Upload Artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marinaMoji-linux-${{ matrix.arch }}
          path: src/bazel-bin/unix/marinaMoji-linux-${{ matrix.arch }}.zip
          if-no-files-found: warn

      - name: Build .deb
        run: |
          set -euo pipefail
          mkdir -p dist
          # Not a tagged release build, so derive a non-clashing dev version
          # (Debian versions must start with a digit).
          VERSION="0.0.0+g$(git rev-parse --short HEAD)"
          bash packaging/linux/build_deb.sh \
            --zip src/bazel-bin/unix/mozc.zip \
            --version "$VERSION" \
            --arch ${{ matrix.deb_arch }} \
            --output-dir dist

      # Hard gate: fail on lintian errors and warnings. Info and pedantic
      # findings are still shown in the report but do not fail the job.
      # Intentional overrides, if ever needed, belong in the package itself
      # (packaging/linux/data/) with a comment saying why.
      - name: lintian
        run: |
          set -euo pipefail
          sudo apt-get install -y lintian
          mkdir -p dist
          report="dist/lintian-${{ matrix.deb_arch }}.txt"
          # pipefail makes the pipeline fail with lintian's status; tee keeps
          # the report even when lintian fails.
          lintian --display-info --show-overrides --fail-on error,warning \
            dist/*.deb 2>&1 | tee "$report"

      - name: Upload .deb
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marinaMoji-linux-${{ matrix.arch }}-deb
          path: |
            dist/*.deb
            dist/lintian-*.txt
          if-no-files-found: error

  test:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev libgtk-3-dev librsvg2-dev libopencc-dev
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel test
        working-directory: ./src
        run: |
          bazelisk test ... -c dbg --test_output=errors --build_tests_only --build_event_json_file=bep.jsonl

      - name: Collect failing test logs
        if: failure() && github.event_name == 'push'
        working-directory: ./src
        run: |
          python3 build_tools/collect_test_logs.py --bep bep.jsonl --out "${GITHUB_WORKSPACE}/test_logs"

      - name: Upload failing test logs
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-linux-${{ matrix.arch }}
          path: test_logs
          if-no-files-found: ignore
