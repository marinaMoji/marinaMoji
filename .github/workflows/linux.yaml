name: CI for Linux
# https://github.com/marinaMoji/marinaMoji/blob/main/docs/build_marinamoji_for_linux.md

# Run on push.
on: push

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    # ubuntu-24.04-arm is GitHub's hosted arm64 runner (free for public repos).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev libgtk-3-dev librsvg2-dev libopencc-dev
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build package --config release_build

      - name: Rename artifact
        working-directory: ./src
        run: |
          cp bazel-bin/unix/mozc.zip bazel-bin/unix/mozc-linux-${{ matrix.arch }}.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mozc-linux-${{ matrix.arch }}
          path: src/bazel-bin/unix/mozc-linux-${{ matrix.arch }}.zip
          if-no-files-found: warn

  test:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev libgtk-3-dev librsvg2-dev libopencc-dev
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel test
        working-directory: ./src
        run: |
          bazelisk test ... -c dbg --build_tests_only --build_event_json_file=bep.jsonl

      - name: Collect failing test logs
        if: failure()
        working-directory: ./src
        run: |
          python3 build_tools/collect_test_logs.py --bep bep.jsonl --out "${GITHUB_WORKSPACE}/test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ runner.os }}
          path: test_logs
          if-no-files-found: ignore
