name: CI for Windows
# https://github.com/marinaMoji/marinaMoji/blob/main/docs/build_marinamoji_on_windows.md

# Run on push, except for changes that only touch documentation (nothing in
# the build reads them).
on:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'scripts/roadmap/**'

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_on_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      # Qt is compiled from source (build_qt.py). Cache the installed result so it
      # is only rebuilt when the build script or the pinned Qt version changes.
      # Restore and save are separate steps so the save happens right after
      # the build. The combined action only saves in a post step, after every
      # later step has succeeded, so a cancelled or failed run threw the
      # 15-20 minute Qt build away.
      - name: Restore Qt build cache
        id: qt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt_cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      - name: Save Qt build cache
        if: steps.qt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: ${{ steps.qt_cache.outputs.cache-primary-key }}

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          if exist third_party\qt_src rmdir third_party\qt_src /s /q

      # Bazel's disk cache, so a run only compiles what changed. Every job
      # restores the newest cache for its architecture, but only the test job
      # saves one, and only on master. The key includes the commit, so every
      # save is a new multi-gigabyte entry; saving from all four jobs on every
      # push overflowed the repository's 10 GB cache limit and evicted the Qt
      # caches. Older entries are pruned after each save.
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bazel_disk_cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-build_on_x64-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-build_on_x64-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build --config x86_simd --disk_cache=%GITHUB_WORKSPACE%\.bazel_disk_cache

      - name: upload marinaMoji-windows-x86_64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marinaMoji-windows-x86_64
          path: src/bazel-bin/win32/installer/marinaMoji64.msi
          if-no-files-found: warn

  build_on_arm64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      # Qt is compiled from source (build_qt.py). Cache the installed result so it
      # is only rebuilt when the build script or the pinned Qt version changes.
      # Restore and save are separate steps so the save happens right after
      # the build. The combined action only saves in a post step, after every
      # later step has succeeded, so a cancelled or failed run threw the
      # 15-20 minute Qt build away.
      - name: Restore Qt build cache
        id: qt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt_cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      - name: Save Qt build cache
        if: steps.qt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: ${{ steps.qt_cache.outputs.cache-primary-key }}

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          if exist third_party\qt_src rmdir third_party\qt_src /s /q

      # Bazel's disk cache, so a run only compiles what changed. Every job
      # restores the newest cache for its architecture, but only the test job
      # saves one, and only on master. The key includes the commit, so every
      # save is a new multi-gigabyte entry; saving from all four jobs on every
      # push overflowed the repository's 10 GB cache limit and evicted the Qt
      # caches. Older entries are pruned after each save.
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bazel_disk_cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-build_on_arm64-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-build_on_arm64-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build --disk_cache=%GITHUB_WORKSPACE%\.bazel_disk_cache

      - name: upload marinaMoji-windows-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marinaMoji-windows-arm64
          path: src/bazel-bin/win32/installer/marinaMoji64.msi
          if-no-files-found: warn

  test_on_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      # Bazel's disk cache, so a run only compiles what changed. Every job
      # restores the newest cache for its architecture, but only the test job
      # saves one, and only on master. The key includes the commit, so every
      # save is a new multi-gigabyte entry; saving from all four jobs on every
      # push overflowed the repository's 10 GB cache limit and evicted the Qt
      # caches. Older entries are pruned after each save.
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bazel_disk_cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_x64-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_x64-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      - name: runtests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          rem This job does not build Qt, so skip the Qt-based character composer.
          bazelisk test -c dbg --config x86_simd --test_output=errors --build_tests_only --build_event_json_file=bep.jsonl --disk_cache=%GITHUB_WORKSPACE%\.bazel_disk_cache -- ... -//gui/character_composer/...

      - name: Save Bazel disk cache
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bazel_disk_cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_x64-${{ github.sha }}

      # Keep only the newest cache of this job; the rest are dead weight
      # against the repository's cache limit.
      - name: Prune older Bazel disk caches
        if: success() && github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prefix="bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_x64-"
          gh cache list --key "$prefix" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
            while read -r id; do gh cache delete "$id" || true; done

      - name: Collect failing test logs
        if: failure()
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools\collect_test_logs.py --bep bep.jsonl --out "%GITHUB_WORKSPACE%\test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-windows-x86_64
          path: test_logs
          if-no-files-found: ignore

  test_on_arm64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    permissions:
      contents: read
      actions: write
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      # Bazel's disk cache, so a run only compiles what changed. Every job
      # restores the newest cache for its architecture, but only the test job
      # saves one, and only on master. The key includes the commit, so every
      # save is a new multi-gigabyte entry; saving from all four jobs on every
      # push overflowed the repository's 10 GB cache limit and evicted the Qt
      # caches. Older entries are pruned after each save.
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bazel_disk_cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_arm64-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_arm64-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-

      - name: runtests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          rem This job does not build Qt, so skip the Qt-based character composer.
          bazelisk test -c dbg --test_output=errors --build_tests_only --build_event_json_file=bep.jsonl --disk_cache=%GITHUB_WORKSPACE%\.bazel_disk_cache -- ... -//gui/character_composer/...

      - name: Save Bazel disk cache
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .bazel_disk_cache
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_arm64-${{ github.sha }}

      # Keep only the newest cache of this job; the rest are dead weight
      # against the repository's cache limit.
      - name: Prune older Bazel disk caches
        if: success() && github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prefix="bazel-disk-${{ runner.os }}-${{ runner.arch }}-test_on_arm64-"
          gh cache list --key "$prefix" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
            while read -r id; do gh cache delete "$id" || true; done

      - name: Collect failing test logs
        if: failure()
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools\collect_test_logs.py --bep bep.jsonl --out "%GITHUB_WORKSPACE%\test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-windows-arm64
          path: test_logs
          if-no-files-found: ignore

  # actions/cache works without this job, but having this would increase the likelihood of cache hit
  # in other jobs. Another approach would be to use "needs:".
  # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow
  cache_deps_on_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py --cache_only

  # actions/cache works without this job, but having this would increase the likelihood of cache hit
  # in other jobs. Another approach would be to use "needs:".
  # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow
  cache_deps_on_arm64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py --cache_only
