name: CI for Lint checks
# https://github.com/marinaMoji/marinaMoji/blob/main/docs/build_marinamoji_in_docker.md

# Run on push.
on: push

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  buildifier:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      # Checkout without submodules to exclude third_party code from lint check
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # buildifier's module graph pulls golang.org/x/sys, which requires
          # Go >= 1.26. setup-go pins GOTOOLCHAIN=local, so the Go version here
          # has to satisfy the tool's dependencies on its own.
          go-version: '1.26'

      - name: Run
        working-directory: ./src
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@v0.0.0-20260824163617-674b29349bf1
          $(go env GOPATH)/bin/buildifier --mode=diff -r .

  opencc-tables:
    # Fails if the committed marinaShin2Kyu*.ocd2 / .txt / .json no longer match
    # what src/regen_opencc.sh produces from the CSV tables.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Install OpenCC
        run: sudo apt-get update && sudo apt-get install -y opencc

      - name: Regenerate tables
        working-directory: ./src
        run: bash regen_opencc.sh

      - name: Check committed tables are up to date
        run: |
          if ! git diff --exit-code -- src/data/marina_opencc; then
            echo "::error::OpenCC tables are stale. Run 'bash regen_opencc.sh' from src/ and commit the result."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard src/data/marina_opencc)" ]; then
            echo "::error::regen_opencc.sh produced untracked files in src/data/marina_opencc."
            exit 1
          fi
