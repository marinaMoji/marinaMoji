name: Release

# Builds signed and notarized macOS packages, Windows MSIs, Linux .deb/.zip
# assets, publishes a GitHub Release, then rebuilds the signed apt repository
# on the gh-pages branch (GitHub Pages).
#
# Push a tag matching v* — this workflow builds the .pkg files with
# Developer ID signing (--define CODESIGN=release), notarizes and staples
# them, then publishes a release with the packages, SHA256SUMS, and build
# provenance attestations (verify with:
#   gh attestation verify <file> --repo <owner>/<repo>).
#
# Windows assets are built unsigned here; the maintainer Authenticode-signs
# the MSIs after the release and replaces them (MSIX via the Microsoft Store
# may cover signing later).
#
# Apt indexes are signed with the CI GPG subkey (secrets APT_GPG_PRIVATE_KEY
# and APT_GPG_PASSPHRASE). The published suite is "unstable" for now; a
# separate stable channel will be added later. See packaging/linux/README.md
# and SECURITY.md.
#
# Product version (About / update checks): each build job overwrites
# src/marina_product_version.txt from the tag (strip leading "v"), then
# verifies the baked-in string after bazel build. You do not need to bump
# that file in git for a release.
#
# The Apple secrets live in the "release" GitHub environment; keep that
# environment restricted to v* tags (and/or required reviewers).

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and notarize but skip the draft release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_macos:
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            macos_cpus: arm64
          - arch: x86_64
            macos_cpus: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set product version from tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # About / update checks read Version::GetProductVersion(), which is
          # compiled from this file. Overwrite from the tag so the tree's
          # placeholder (often an older release) never ships in About.
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > src/marina_product_version.txt
          echo "MARINA_PRODUCT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Product version: $VERSION"
          cat src/marina_product_version.txt

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        working-directory: ./src
        run: |
          python3 build_tools/update_deps.py

      # Qt is compiled from source (build_qt.py). Cache the installed result so it
      # is only rebuilt when the build script or the pinned Qt version changes.
      - name: Restore Qt build cache
        id: qt_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ matrix.macos_cpus }}-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt_cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: |
          python3 build_tools/build_qt.py --release --confirm_license --macos_cpus=${{ matrix.macos_cpus }}

      - name: Set up signing keychain
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_NAME="marinamoji-release.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          # codesign resolves identities via the search list (the build
          # scripts do not pass --keychain), so the keychain must be on it.
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain

          echo "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -d > "$RUNNER_TEMP/app.p12"
          echo "$APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64" | base64 -d > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN_NAME" \
            -f pkcs12 -P "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN_NAME" \
            -f pkcs12 -P "$APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD" -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          # Allow Apple's signing tools to use the keys without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" > /dev/null

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN_NAME" \
            | grep -o '"Developer ID Installer: [^"]*"' | head -n1 | tr -d '"')"

          if [[ -z "$APP_IDENTITY" || -z "$INSTALLER_IDENTITY" ]]; then
            echo "::error::Developer ID identities not found in imported certificates."
            exit 1
          fi
          for identity in "$APP_IDENTITY" "$INSTALLER_IDENTITY"; do
            if [[ "$identity" != *"($APPLE_TEAM_ID)"* ]]; then
              echo "::error::Identity '$identity' does not match APPLE_TEAM_ID."
              exit 1
            fi
          done

          {
            echo "APP_IDENTITY=$APP_IDENTITY"
            echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
            echo "KEYCHAIN_FILE=${KEYCHAIN_NAME}-db"
          } >> "$GITHUB_ENV"

      - name: Configure release signing identities
        working-directory: ./src
        run: |
          set -euo pipefail
          /usr/bin/sed -i '' \
            -e "s|^MACOS_CODESIGN_IDENTITY_RELEASE = .*|MACOS_CODESIGN_IDENTITY_RELEASE = \"${APP_IDENTITY}\"|" \
            -e "s|^MACOS_CODESIGN_IDENTITY_INSTALLER_RELEASE = .*|MACOS_CODESIGN_IDENTITY_INSTALLER_RELEASE = \"${INSTALLER_IDENTITY}\"|" \
            -e "s|^MACOS_KEYCHAIN_INSTALLER_RELEASE = .*|MACOS_KEYCHAIN_INSTALLER_RELEASE = \"${KEYCHAIN_FILE}\"|" \
            config.bzl
          grep -n "_RELEASE" config.bzl

      - name: bazel build (signed)
        working-directory: ./src
        run: |
          bazelisk build package --macos_cpus=${{ matrix.macos_cpus }} \
            --config release_build \
            --define CODESIGN=release \
            --define CHANNEL=stable

      - name: Verify product version in build
        if: github.ref_type == 'tag'
        working-directory: ./src
        run: |
          set -euo pipefail
          EXPECTED="${MARINA_PRODUCT_VERSION}"
          HEADER="$(find bazel-bin -name product_version_def.h | head -n1)"
          [[ -n "$HEADER" ]] || { echo "product_version_def.h not found under bazel-bin"; exit 1; }
          bash build_tools/verify_product_version.sh --expected "$EXPECTED" --header "$HEADER"

      - name: Notarize and staple
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_NOTARY_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail

          # Copy out of bazel-bin: outputs are read-only and stapling
          # modifies the file (checksums are computed after stapling).
          DIST="$RUNNER_TEMP/dist"
          PKG="$DIST/marinaMoji-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.pkg"
          mkdir -p "$DIST"
          cp src/bazel-bin/mac/marinaMoji.pkg "$PKG"
          chmod u+w "$PKG"

          KEY="$RUNNER_TEMP/notary_key.p8"
          printf '%s\n' "$APPLE_NOTARY_API_PRIVATE_KEY_P8" > "$KEY"

          SUBMISSION="$(xcrun notarytool submit "$PKG" \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 1h --output-format json)"
          echo "$SUBMISSION"
          STATUS="$(echo "$SUBMISSION" | jq -r .status)"
          SUBMISSION_ID="$(echo "$SUBMISSION" | jq -r .id)"

          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::Notarization failed with status '$STATUS'. Log:"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            rm -f "$KEY"
            exit 1
          fi
          rm -f "$KEY"

          xcrun stapler staple "$PKG"
          echo "PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: Verify package
        run: |
          set -euo pipefail
          pkgutil --check-signature "$PKG_PATH"
          xcrun stapler validate "$PKG_PATH"
          spctl --assess -vv --type install "$PKG_PATH"

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marinaMoji-macos-${{ matrix.arch }}
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error

  # Unsigned in CI — the maintainer signs the MSIs after the release (MSIX via
  # the Microsoft Store may cover Windows signing later). No secrets needed, so
  # no "release" environment.
  build_windows:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            extra_configs: --config x86_simd
          - arch: arm64
            runner: windows-11-arm
            extra_configs: ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set product version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > src/marina_product_version.txt
          echo "MARINA_PRODUCT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Product version: $VERSION"
          cat src/marina_product_version.txt

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/update_deps.py

      # Qt is compiled from source (build_qt.py). Cache the installed result so it
      # is only rebuilt when the build script or the pinned Qt version changes.
      - name: Restore Qt build cache
        id: qt_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt_cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        shell: cmd
        working-directory: .\src
        run: |
          if exist third_party\qt_src rmdir third_party\qt_src /s /q

      - name: build installer
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build ${{ matrix.extra_configs }} --define CHANNEL=stable

      - name: Verify product version in build
        if: github.ref_type == 'tag'
        shell: bash
        working-directory: ./src
        run: |
          set -euo pipefail
          EXPECTED="${MARINA_PRODUCT_VERSION}"
          HEADER="$(find bazel-bin -name product_version_def.h | head -n1)"
          TOOL="$(find bazel-bin -name marinamoji_tool.exe | head -n1)"
          [[ -n "$HEADER" ]] || { echo "product_version_def.h not found under bazel-bin"; exit 1; }
          [[ -n "$TOOL" ]] || { echo "marinamoji_tool.exe not found under bazel-bin"; exit 1; }
          bash build_tools/verify_product_version.sh \
            --expected "$EXPECTED" --header "$HEADER" --binary "$TOOL"

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p dist
          # One asset per arch: marinaMoji64.msi carries en-US, fr-FR and
          # ja-JP as embedded language transforms.
          cp src/bazel-bin/win32/installer/marinaMoji64.msi \
            "dist/marinaMoji-${GITHUB_REF_NAME}-windows-${{ matrix.arch }}.msi"

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marinaMoji-windows-${{ matrix.arch }}
          path: dist/*.msi
          if-no-files-found: error

  build_linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set product version from tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > src/marina_product_version.txt
          echo "MARINA_PRODUCT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Product version: $VERSION"
          cat src/marina_product_version.txt

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev libgtk-3-dev librsvg2-dev libopencc-dev dpkg-dev unzip
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build package --config release_build --define CHANNEL=stable

      - name: Verify product version in build
        if: github.ref_type == 'tag'
        working-directory: ./src
        run: |
          set -euo pipefail
          EXPECTED="${MARINA_PRODUCT_VERSION}"
          HEADER="$(find bazel-bin -name product_version_def.h | head -n1)"
          [[ -n "$HEADER" ]] || { echo "product_version_def.h not found under bazel-bin"; exit 1; }
          TMP="$(mktemp -d)"
          unzip -q -j bazel-bin/unix/mozc.zip 'usr/lib/marinamoji/mozc_tool' -d "$TMP"
          bash build_tools/verify_product_version.sh \
            --expected "$EXPECTED" --header "$HEADER" --binary "$TMP/mozc_tool"

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/bazel-bin/unix/mozc.zip \
            "dist/marinaMoji-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.zip"

          # Debian versions must start with a digit; tags are v<version>.
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="0.0.0+g$(git rev-parse --short HEAD)"
          fi
          bash packaging/linux/build_deb.sh \
            --zip src/bazel-bin/unix/mozc.zip \
            --version "$VERSION" \
            --arch ${{ matrix.deb_arch }} \
            --output-dir dist

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marinaMoji-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish_release:
    if: github.ref_type == 'tag'
    needs:
      - build_macos
      - build_windows
      - build_linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.pkg *.msi *.zip *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          # Tag names containing -rc / -alpha / -beta are GitHub prereleases so
          # releases/latest stays on final versions; in-app update check can
          # still opt into unstable via Preferences.
          case "$GITHUB_REF_NAME" in
            *-rc*|*-RC*|*-alpha*|*-beta*) EXTRA_FLAGS+=(--prerelease) ;;
          esac
          # The tag may already have a release — e.g. when the tag was cut
          # from the GitHub UI ("Draft a new release"), which creates the
          # release and the tag together and only then triggers this run.
          # In that case attach the assets instead of failing, and keep the
          # hand-written notes rather than regenerating them.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets to it."
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              *.pkg *.msi *.zip *.deb SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "marinaMoji $GITHUB_REF_NAME" \
              --generate-notes \
              "${EXTRA_FLAGS[@]}" \
              *.pkg *.msi *.zip *.deb SHA256SUMS
          fi
  # Rebuild the GitHub Pages apt repository from every released .deb and sign
  # the indexes with the CI GPG subkey (see SECURITY.md / packaging/linux/).
  # Extracted to apt.yaml so it can also be dispatched on its own to repair
  # the published repository without cutting a new tag.
  publish_apt:
    if: github.ref_type == 'tag'
    needs:
      - publish_release
    uses: ./.github/workflows/apt.yaml
    secrets: inherit
    permissions:
      contents: write
