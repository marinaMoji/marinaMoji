name: Typing issue
description: Report conversion, typing, or dictionary issues in marinaMoji.
title: 'Typing issue: '

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Please include the exact input, the committed output, and the expected output.
        >
        > For dictionary or conversion-policy context, see
        > [Vocabulary Policy](../../VOCABULARY_POLICY.md).

  - type: input
    id: na
    attributes:
      label: 'N/A'
      placeholder: Do not use this field.
    validations:
      required: true
