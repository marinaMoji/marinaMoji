<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>marinaMoji</title>
<style>
body { font-family: -apple-system, "Hiragino Sans", Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #222; }
p { margin: 0 0 0.8em; }
</style>
</head>
<body>
<p>marinaMoji をインストールしました。</p>
<p><strong>あと一つ手順があります:</strong> marinaMoji を入力ソースとして追加してください。システム設定 → キーボード → 入力ソース → 編集… を開き、+ をクリックして「日本語」を選び、marinaMoji を選択して「追加」をクリックします。(以前のバージョンから更新した場合は、すでに追加されています。)</p>
<p>+ に marinaMoji が表示されない場合は、一度ログアウトして再ログインしてから、もう一度お試しください。</p>
</body>
</html>
